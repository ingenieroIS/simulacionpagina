<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detección de Enfermedades en Plantas - AI</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 120px;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 10px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #666;
      font-size: 0.95rem;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      text-align: center;
    }

    .upload-box {
      border: 2px dashed #a5d6a7;
      border-radius: 8px;
      padding: 30px 15px;
      background-color: #f1f8e9;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      margin-bottom: 20px;
    }

    .upload-box:hover {
      background-color: #e8f5e9;
      border-color: var(--primary-color);
    }

    .upload-icon {
      font-size: 40px;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .upload-text {
      font-size: 0.95rem;
      color: #444;
    }

    #fileInput {
      display: none;
    }

    .preview-container {
      display: none;
      margin-bottom: 20px;
    }

    .preview-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .btn-analyze {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
      display: none;
    }

    .btn-analyze:hover {
      background-color: var(--primary-hover);
    }

    .btn-analyze:disabled {
      background-color: #a5d6a7;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      background-color: #e8f5e9;
      border-left: 5px solid var(--primary-color);
      display: none;
      text-align: left;
    }

    .result-box.error {
      background-color: #ffebee;
      border-left-color: #c62828;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .result-box.error .result-title {
      color: #c62828;
    }

    .result-detail {
      font-size: 0.95rem;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <img src="Imagenes/logo.jpg" alt="Logo Diagnóstico de Plantas" class="logo">
    <h1>AgroScan AI</h1>
    <p class="subtitle">Diagnóstico automático de enfermedades mediante Visión Artificial</p>
  </header>

  <main class="container">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text"><strong>Haz clic para tomar o subir una foto</strong><br><small>(Formatos JPG, PNG)</small></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <div class="preview-container" id="previewContainer">
      <img id="previewImage" class="preview-img" alt="Foto de la hoja">
    </div>

    <button id="analyzeBtn" class="btn-analyze">Diagnosticar Hoja</button>

    <div class="result-box" id="resultBox">
      <div class="result-title" id="resultTitle">Resultado del análisis</div>
      <div class="result-detail" id="resultDetail">Esperando imagen...</div>
    </div>
  </main>

  <script>
    // =============================================================
    // ⚙️ CONFIGURACIÓN DE LA API DE LA RED NEURONAL
    // =============================================================
    // Coloca aquí la URL del endpoint de tu API en Colab / Flask / Ngrok / Servidor
    const API_URL = "https://TU_SUBDOMINIO.ngrok-free.app/predict"; 
    // =============================================================

    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultDetail = document.getElementById('resultDetail');

    let base64Image = "";

    // 1. Manejo de la selección de imagen y conversión a Base64
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          base64Image = event.target.result;
          previewImage.src = base64Image;
          previewContainer.style.display = 'block';
          analyzeBtn.style.display = 'block';
          resultBox.style.display = 'none';
          resultBox.classList.remove('error');
        };
        reader.readAsDataURL(file);
      }
    });

    // 2. Envío de la información a la API de la red neuronal
    analyzeBtn.addEventListener('click', async () => {
      // Estado visual de carga
      resultBox.style.display = 'block';
      resultBox.classList.remove('error');
      resultTitle.textContent = "Procesando...";
      resultDetail.textContent = "Enviando imagen a la red neuronal...";
      analyzeBtn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image: base64Image })
        });

        const data = await response.json();

        if (response.ok) {
          // Mostrar resultado entregado por la red neuronal
          resultTitle.textContent = "Diagnóstico Final";
          
          // Asumiendo que tu API retorna {"prediction": "Nombre", "confidence": 0.95}
          const enfermedad = data.prediction || "Enfermedad no identificada";
          const confianza = data.confidence ? (data.confidence * 100).toFixed(1) + "%" : "N/A";

          resultDetail.innerHTML = `
            <strong>Enfermedad detectada:</strong> ${enfermedad}<br>
            <strong>Nivel de confianza:</strong> ${confianza}
          `;
        } else {
          throw new Error(data.error || "Respuesta no válida del servidor");
        }

      } catch (error) {
        console.error("Error al conectar con la API:", error);
        resultBox.classList.add('error');
        resultTitle.textContent = "Error de conexión";
        resultDetail.textContent = "No se pudo obtener el diagnóstico de la red neuronal. Revisa la URL de la API o la conexión del servidor.";
      } finally {
        analyzeBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
